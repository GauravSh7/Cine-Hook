services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cinehook
      POSTGRES_PASSWORD: cinehook_local
      POSTGRES_DB: cinehook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinehook -d cinehook"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://cinehook:cinehook_local@postgres:5432/cinehook
      REDIS_URL: redis://redis:6379
      # An empty value allows infrastructure-only Compose commands. The API's
      # config validator refuses to start until a real signing key is supplied.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN_SECONDS: 3600
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
volumes:
  postgres_data:
  redis_data:
